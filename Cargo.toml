[package]
name = "aic"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = "0.12.0"
owo-colors = "4.4.0"
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tiny_http = "0.12"
toml = "1.1.6"
ureq = { version = "3.1.4", features = ["json"] }
