<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aic chat</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<aside aria-label="Conversations">
  <header>
    <div class="brand"><img src="/favicon.svg" alt="" width="20" height="20"> aic chat</div>
    <button id="new" class="primary" title="New conversation (Ctrl+Shift+O)"></button>
    <input type="search" id="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off">
  </header>
  <nav id="list"></nav>
  <footer id="repo"></footer>
</aside>
<div id="scrim"></div>
<main>
  <div id="bar">
    <button id="menu" class="icon" aria-label="Conversations"></button>
    <span id="chips"></span>
    <button id="addbtn" class="icon" aria-label="Add participant" title="Add participant"></button>
  </div>
  <div id="banner" role="alert" hidden></div>
  <div id="view">
    <div id="layout" role="group" aria-label="Reply layout"></div>
    <div id="msgs" aria-label="Messages"></div>
  </div>
  <footer id="composer">
    <button id="jump" type="button"></button>
    <div id="ac" role="listbox"></div>
    <form id="form">
      <textarea id="input" rows="2" aria-label="Message" placeholder="Write your message…" autofocus></textarea>
      <div class="toolbar">
        <span class="tolabel" id="tolabel">To:</span>
        <span id="to" role="group" aria-labelledby="tolabel"></span>
        <button class="send" id="send" aria-label="Send"></button>
      </div>
    </form>
    <div class="hint" id="hint">Enter sends · Shift+Enter new line · @ mentions · / skills</div>
  </footer>
</main>

<dialog id="pdialog" aria-labelledby="ptitle">
  <form id="pform" method="dialog">
    <h2 id="ptitle">Add participant</h2>
    <div class="grid2">
      <label>Name <input type="text" id="pname" placeholder="Claude-b" autocomplete="off" spellcheck="false"></label>
      <label>Agent <select id="pagent"></select></label>
      <label>Model <input type="text" id="pmodel" list="pmodels" placeholder="agent default" autocomplete="off" spellcheck="false"></label>
      <label>Effort <input type="text" id="peffort" list="pefforts" placeholder="agent default" autocomplete="off" spellcheck="false"></label>
    </div>
    <datalist id="pmodels"></datalist>
    <datalist id="pefforts"></datalist>
    <p class="note warn" id="pagentwarn" hidden>The new agent starts without this conversation's history.</p>
    <fieldset class="colours">
      <legend>Colour</legend>
      <span id="phues" role="radiogroup" aria-label="Colour"></span>
    </fieldset>
    <label>Role / instructions <input type="text" id="prole" placeholder="e.g. strict code reviewer (optional)" autocomplete="off"></label>
    <fieldset>
      <legend>File access</legend>
      <div class="seg" role="radiogroup" aria-label="File access">
        <label><input type="radio" name="paccess" value="read" checked><span>Read only</span></label>
        <label><input type="radio" name="paccess" value="write"><span>Can edit</span></label>
      </div>
      <p class="note warn" id="pwritewarn" hidden></p>
    </fieldset>
    <p class="note err" id="perror" hidden></p>
    <div class="buttons">
      <button type="button" id="premove" class="danger">Remove</button>
      <span class="grow"></span>
      <button type="button" id="pcancel">Cancel</button>
      <button type="submit" id="psave" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"><span id="toasttext"></span><button id="undo" type="button">Undo</button></div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script src="/chat.js"></script>
</body>
</html>
