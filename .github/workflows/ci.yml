name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo test --locked && cargo build --locked
      # Browser coverage remains available locally in tests/*.browser.cjs. It is
      # temporarily excluded here because Chromium is flaky on hosted runners.
      - name: CLI and policy tests (no provider calls)
        run: |
          AIC_TEST_BINARY="$PWD/target/debug/aic" \
          node --test tests/*.test.cjs tests/*.integration.cjs
